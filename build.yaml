framework: "net9.0"
overview: "Broadcast a movie from your library as a live, owner-controlled Live TV channel"
description: >
  Movie Night lets a server admin pick a movie from their Jellyfin libraries
  and go live: a single server-side encode is served to every client as a
  normal Live TV channel. Viewers join in progress, live-TV style.
category: "Live TV"
owner: "jon"
artifacts:
- "Jellyfin.Plugin.MovieNight.dll"
- "hls/"
changelog: >
  0.2.2.0: Fix Directory.Build.props - it hardcoded the assembly's actual
  Version/AssemblyVersion/FileVersion to 0.0.0.0 for every build (an
  unbumped template placeholder), so once Jellyfin loaded the plugin
  post-restart it read the real assembly version (0.0.0.0) instead of the
  catalog metadata and showed "Repository: Unknown". Now kept in sync with
  this file's version on every release.
  0.2.1.0: Fix startup-ordering bug - tuner/listing registration ran before
  Kestrel was listening, so SaveTunerHost's loopback validation fetch always
  failed with connection refused and nothing ever registered. Now deferred
  to IHostApplicationLifetime.ApplicationStarted.
  0.2.0.0: Phase 1 spike - registers an M3U tuner + XMLTV listings provider
  pointing at a hand-made static HLS test asset. Still no real broadcast
  logic (ffmpeg/BroadcastManager is Phase 2).
  0.1.0.0: Phase 0 scaffold.
