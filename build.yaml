overview: "Broadcast a movie from your library as a live, owner-controlled Live TV channel"
description: >
  Movie Night lets a server admin pick a movie from their Jellyfin libraries
  and go live: a single server-side encode is served to every client as a
  normal Live TV channel. Viewers join in progress, live-TV style.
category: "Live TV"
owner: "jon"
artifacts:
- "Jellyfin.Plugin.MovieNight.dll"
changelog: >
  0.3.19.0: Fixes a real double-Go-Live race, found live within minutes of
  shipping the new self-service UI in 0.3.18.0 - the config page's Go Live
  button gave no "in progress" feedback while GoLiveAsync's own up-to-30s
  wait was pending, so a natural impatient re-click (or genuine
  double-click) fired a second concurrent GoLiveAsync call. The server
  checked "already Starting/Live" at the top of the method but only
  actually flipped state to Starting AFTER an await (ffprobe) - both calls
  could pass the check before either claimed the state, both spawned
  ffmpeg into the identical MovieDirectory, and stomped each other: one
  process's CleanDirectory() wiped the other's segments out from under it
  before its own startup-detection loop ever saw them, so it looked like
  it was "encoding fine" per its own stderr (frames climbing normally) but
  never produced a detectable segment and timed out at 30s regardless.
  Fixed at the root - the re-check and the state claim now happen
  atomically in one lock, immediately before the only await in the method,
  closing the race window entirely. Also disables the Go Live/Stop/Pause-
  Resume buttons for the duration of their own in-flight request, as a
  cheap first line of defense against the double-click that actually
  triggers this class of bug.
  0.3.18.0: Real self-service controls on the config page - Jon shouldn't
  need someone running curl commands on his behalf to start, stop, pause,
  resume his own stream or turn the spike test channels on and off. Adds:
  a Pause/Resume toggle button next to Go Live/Stop (promoted from the
  debug-only /freeze /unfreeze endpoints to real /MovieNight/api/pause and
  /resume endpoints - IsPaused is now part of the status response the UI
  already polls); a client-sessions panel showing each session's live
  IsPaused/position state (previously only checkable via the debug API
  directly); two checkboxes (off by default) to enable/disable the raw-TS
  and switcher spike channels via real plugin configuration, with a save
  button that also forces an immediate guide refresh so the channel list
  updates within seconds instead of waiting up to 24h; three buttons to
  drive the switcher spike's zmq input selection instead of a raw curl
  call. The two spike channels no longer show up in the Live TV channel
  list unless explicitly enabled - they were always-on before, which was
  part of tonight's channel-confusion problem.
  0.3.17.0: Single-process/multi-input switcher spike, the other spike
  queued alongside the raw-TS tuner test (see planning/DECISIONS.md
  2026-08-14). Adds a third always-tunable test channel ("Movie Night
  (switcher spike)"): one continuous ffmpeg process holds three synthetic
  color/tone inputs open simultaneously (standing in for the real welcome/
  pause/goodbye assets, which don't exist yet), switched live via a
  streamselect filter controlled over ffmpeg's zmq socket - a new debug
  endpoint (POST /MovieNight/api/debug/switcher-select?input=N) fires the
  switch via ffmpeg's own bundled zmqsend helper. Deliberately does not
  attempt movie seek/switching - ffmpeg has no live-reseek primitive for an
  open input regardless of switcher architecture, per the ruling; this
  spike only tests whether lossless switching among static sources
  survives Jellyfin's own remux hop, and whether this NAS's jellyfin-ffmpeg
  build even includes libzmq support (zmqsend may simply not exist, which
  is itself a valid answer). Refactors the raw-TS spike's process-to-
  response-body piping into a shared PipeRawTsProcessAsync helper, reused
  by both spike endpoints.
  0.3.16.0: Raw MPEG-TS tuner spike, queued by the architect conversation
  alongside the single-process switcher and Roku native-pause-detection
  spikes (see planning/DECISIONS.md 2026-08-14). Adds a second, always-
  tunable test channel ("Movie Night (raw TS spike)") completely
  independent of the real broadcast's state machine: tuning it spawns a
  fresh synthetic testsrc/tone ffmpeg process writing raw -f mpegts
  straight to stdout, piped directly to the client - no HLS, no playlist,
  no segment files. Answers one open architectural question: does
  Jellyfin's M3U tuner accept and remux a raw continuous-stream URL the
  same way it does our hand-rolled HLS? If yes, this eliminates the entire
  hand-written-HLS-playlist risk surface (segment-window bookkeeping,
  EXT-X-DISCONTINUITY sequencing, the MEDIA-SEQUENCE/DISCONTINUITY-SEQUENCE
  gaps already flagged as unverified) for the real channel too. Debug-only,
  does not touch BroadcastManager's real state, encoders, or directories -
  the fan-out-to-multiple-simultaneous-viewers question is deliberately out
  of scope for this yes/no spike.
  0.3.15.0: Fixes the dual-writer collision diagnosed right after spike 6 -
  the movie encoder now writes into its own private directory
  (MovieDirectory) from the moment Go Live starts, instead of writing
  segment_NNN.ts and its own live master.m3u8 directly into the served
  HlsDirectory. BroadcastManager becomes the sole writer of the served
  master.m3u8 for the whole broadcast lifetime, not just after the first
  pause - the pointer/splice mechanism (SpliceTick, WriteServedPlaylist)
  now activates at Go Live itself rather than waiting for the first Pause().
  This is what spike 6's live test was actually hitting: two writers racing
  on the same master.m3u8 path caused the flip-flop between paused-filler
  and live-movie content Jon saw. Also fixes two things that broke as a
  side effect of HlsDirectory no longer holding any segment files: the
  stall watchdog now checks whether the SERVED output is still advancing
  (a timestamp stamped on every spliced segment) instead of scanning
  HlsDirectory for fresh .ts files, and the disk guard now sums the real
  source directories (movie/filler/resume) instead of the now-mostly-empty
  HlsDirectory. Also removes now-dead code: the seed-from-HlsDirectory
  fallback in Pause() (never needed once segments are tracked from Go Live
  onward) and the old HasHlsOutput startup-detection helper.
  0.3.14.0: Spike 6 - reworks the splice mechanism into a true pointer
  model, per Jon: "what we've built is largely a pointer for an HLS
  stream... we need to seamlessly transition pointing from one stream to
  another." Previously the movie encoder was killed immediately on pause
  and its segments were physically copied into the served directory under
  a shared numbering scheme - a real collision/race source. Now: the movie
  encoder is left running untouched through the whole pause (only torn
  down at the start of Resume(), synchronously, once its replacement is
  about to take over), each encoder (movie/filler/resumed-movie) writes
  under its own distinct filename prefix in its own directory, and
  MovieNightController resolves a requested segment to the right directory
  by prefix - no file copying anywhere. Removes the whole class of bugs
  from tonight's testing: the segment-copy IOExceptions, the shared
  numbering collisions, and the delayed-teardown exit-handling race.
  0.3.13.0: Generalizes the video-switcher principle (Jon's framing) to both
  transitions, not just the resume warm-up already fixed in 0.3.12.0. On
  resume, after the new movie encoder's first segment appears, it now runs
  for an extra 30s to build a real buffer before the served output cuts
  over - not just the instant a single segment exists. On pause, the old
  movie encoder is no longer killed immediately: the served output switches
  to the already-warm filler right away, but the old encoder stays alive
  for a 60s grace window (in case any client is still mid-transition)
  before being torn down in the background. A switcher never cuts to a
  source before it's rolling, and never tears down the old one the instant
  it cuts away.
  0.3.12.0: Fixes the actual cause of "resume never plays" - Resume() was
  stopping the filler splice timer and killing the last encoder BEFORE
  spawning the new movie encoder and waiting (up to 30s) for its first
  segment. That whole wait left the served playlist completely stalled,
  which is exactly what Jellyfin's downstream remux treats as the stream
  ending - same class of bug as the original pause-side cold-start issue
  (0.3.8.0), just on the resume side this time. Per Jon: we're building a
  video switcher, and a switcher never cuts to a source before it's
  rolling. Resume() now leaves the filler feed running the entire time the
  new movie encoder warms up in the background, and only switches the
  served source once that encoder is confirmed producing output.
  0.3.11.0: A/B live-tested 0.3.10.0 against 0.3.9.0 on identical conditions
  (rolled the NAS back and re-tested pause) - confirmed 0.3.10.0's trigger
  change (splice timer fires immediately instead of after a guaranteed
  synchronous first splice) regressed the pause path, even though that
  change was aimed at fixing resume. Restores Pause() to 0.3.9.0's proven
  pattern (synchronous first splice, then a timer with a real delay before
  its own first tick) - Resume() keeps 0.3.10.0's fix, since pause breaking
  first blocked ever re-testing resume on that version.
  0.3.10.0: Fixes the actual root cause behind 0.3.9.0's stuck-on-resume
  failure - Pause()/Resume() had two separate triggers for the splice-copy
  work (one manual call plus a separately-started repeating timer), and
  those two could run concurrently, both trying to write the same segment
  filename at once. One write would win, the other would fail with "file in
  use," and the code just gave up on that failure without ever advancing -
  so it retried the identical failing copy forever and the served playlist
  froze. Now there's exactly one trigger (the timer, told to fire
  immediately), plus a re-entrancy guard on the copy routine itself as a
  backstop. Also bumps the pause rewind from 15s to 60s - real round-trip
  time (encoder startup + downstream buffering) can take up to a minute, so
  15s wasn't enough to avoid viewers perceiving a skip forward.
  0.3.9.0: Fixes a resume-crash bug found in the 0.3.8.0 live test - Resume()
  copied the resumed movie's first segment into the served directory once,
  but never restarted the periodic splice timer, so the served playlist
  stopped updating a few seconds after resume even though the movie encoder
  itself was running fine (confirmed real-time, healthy, in its own private
  directory). Our own 30s stall watchdog then killed the whole broadcast.
  Resume() now restarts the splice timer, same as Pause() does.
  0.3.8.0: Fixes spike 5's live test failure - the filler encoder now starts
  running continuously right after Go Live instead of on-demand at pause
  time. The on-demand version left a gap of a few seconds between killing
  the movie encoder and the filler being ready, during which Jellyfin's own
  downstream remux (which every Live TV client goes through) treated the
  stalled playlist as the stream ending and quit, kicking both a real
  browser and Roku back to the channel list on the first live test. Pause
  now splices to whatever the already-warm filler has produced - zero gap.
  0.3.7.0: Spike 5 for universal pause - replaces spike 4's SIGSTOP approach
  (mechanically clean but desynced across clients due to Jellyfin's own
  remux hop) with the filler-channel splice mechanism ruled in
  planning/DECISIONS.md: a background filler encoder gets spliced into the
  served playlist with EXT-X-DISCONTINUITY on pause, and the movie encoder
  is respawned a little before the pause point and spliced back in on
  resume. Once a broadcast has paused at least once, BroadcastManager (not
  ffmpeg) owns writing the served master.m3u8, copying segments in from
  private per-source directories. Debug endpoints unchanged
  (/MovieNight/api/debug/freeze, /unfreeze - now driving Pause()/Resume()).
  0.3.6.0: Spike 4 for universal pause - replaces spike 3's kill-and-respawn
  freeze (which stopped writing segments and tripped the stall watchdog,
  root cause not diagnosed) with SIGSTOP/SIGCONT on the SAME running ffmpeg
  process: no reconstruction needed, resumes exactly where it left off. Also
  fixes a real gap found while debugging spike 3 - the stall-watchdog failure
  path never captured ffmpeg's stderr, unlike the startup-timeout path, so a
  stalled encoder's actual error was invisible. Debug endpoints unchanged
  (/MovieNight/api/debug/freeze, /unfreeze).
  0.3.5.0: Spike 3 for universal pause - adds BroadcastManager.FreezeAsync/
  UnfreezeAsync and matching debug endpoints (/MovieNight/api/debug/freeze,
  /unfreeze) that swap the running encoder for a synthetic black/silent
  source (freeze) or the real movie from the start (unfreeze), writing to the
  same master.m3u8/segment filenames without touching state, the HLS
  directory, or the guide. Tests whether an already-tuned client survives an
  encoder swap transparently, with no command pushed to the client at all -
  spike 2 found SendPlaystateCommand doesn't get honored, so this tests the
  alternative of freezing the one shared stream instead of commanding each
  client. Not resume-position-aware; not the real feature; debug-only.
  0.3.4.0: Spike build for the universal-pause architecture decision (see
  planning/DECISIONS.md) - adds temporary admin-only debug endpoints
  (/MovieNight/api/debug/sessions, /MovieNight/api/debug/playstate) to verify
  two open questions against real Jellyfin behavior before any real pause
  code is written: does SessionInfo.PlayState report correctly for a Live TV
  tuner session, and does ISessionManager.SendPlaystateCommand get honored by
  real clients. No user-facing change.
  0.3.3.0: The live Go Live test also surfaced a design gap, not a bug: guide-
  based clients (Roku) showed "no schedule information" during the broadcast.
  Root cause - Jellyfin's built-in "Refresh Guide" scheduled task only runs
  once every 24h by default, so without an explicit trigger a real
  movie-length broadcast would still finish before the guide ever caught up.
  BroadcastManager now calls IGuideManager.RefreshGuide (fire-and-forget) on
  every state change - Go Live, natural end, crash, and explicit Stop - so
  guide-based clients see current info promptly in both directions.
  0.3.2.0: Second real QSV failure from the same live Go Live test, found
  right after 0.3.1.0's fix cleared the first one: scale_qsv rejects the
  round-to-even "-2" width value libavfilter's software scale and scale_vaapi
  accept ("Size values less than -1 are not acceptable") - QSV only accepts
  -1. Changed scale_qsv's width arg from -2 to -1.
  0.3.1.0: Fixes a real QSV broadcast failure hit on first live Go Live test
  against this NAS's Intel QSV hardware - ffmpeg exited (code 218) with
  "Impossible to convert between the formats supported by the filter ... and
  the filter 'auto_scale_0'". Root cause: the QSV video-filter chain fed
  scale_qsv software-decoded frames instead of QSV-resident ones (the VAAPI
  branch already hwuploads first; QSV didn't). Fixed by adding
  format=nv12,hwupload=extra_hw_frames=64 before scale_qsv, mirroring VAAPI.
  0.3.0.0: Phase 2 - BroadcastManager (real ffmpeg lifecycle: Go Live/Stop,
  single-rung 720p H.264/AAC encode, natural-end/crash/stall/disk-guard
  handling, no auto-restart), FfmpegCommandBuilder (unit-tested per §5.3's
  HW accel matrix - QSV/VAAPI/NVENC/AMF/software), and the empty-vs-populated
  playlist trick so the channel only appears in the guide while actually
  live. Phase 1's embedded static test clip is gone - stream/playlist/epg
  now serve the real broadcast. Minimal dev test harness on the config page
  (item ID input + Go Live/Stop + status polling) - the real movie picker
  is Phase 3.
  0.2.x: Phase 1 - M3U tuner + XMLTV listings provider registration
  (ITunerHostManager/IListingsManager, in-process, no REST). Five point
  releases to get there: two startup-ordering races, a route-ambiguity bug,
  a hardcoded-0.0.0.0 assembly version, and a NAS filesystem quirk where
  zip-extracted plugin files couldn't actually be opened at runtime (fixed
  by embedding the test asset into the DLL). Full history in repo CLAUDE.md.
  0.1.0.0: Phase 0 scaffold.
