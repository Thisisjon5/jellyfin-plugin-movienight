overview: "Broadcast a movie from your library as a live, owner-controlled Live TV channel"
description: >
  Movie Night lets a server admin pick a movie from their Jellyfin libraries
  and go live: a single server-side encode is served to every client as a
  normal Live TV channel. Viewers join in progress, live-TV style.
category: "Live TV"
