<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Movie Night</title>
</head>
<body>
    <div id="MovieNightConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <p>
                    <strong>Phase 2 test harness.</strong> This is a bare-bones dev control panel -
                    paste a movie's item ID (visible in its details page URL as
                    <code>?id=...</code>), pick a channel name, and Go Live. The real movie
                    picker/subtitle/quality UI is Phase 3.
                </p>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="MovieNightItemId">Item ID</label>
                    <input id="MovieNightItemId" type="text" is="emby-input" placeholder="e.g. 8a6e5cf0-30f3-420a-a8ce-e7704d690f94" />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="MovieNightChannelName">Channel name</label>
                    <input id="MovieNightChannelName" type="text" is="emby-input" value="Movie Night" />
                </div>

                <div>
                    <button id="MovieNightGoLive" is="emby-button" type="button" class="raised button-submit block emby-button">
                        <span>Go Live</span>
                    </button>
                    <button id="MovieNightStop" is="emby-button" type="button" class="raised block emby-button">
                        <span>Stop</span>
                    </button>
                </div>

                <h3>Status</h3>
                <pre id="MovieNightStatus">(loading...)</pre>
            </div>
        </div>

        <script type="text/javascript">
            (function () {
                var pollTimer = null;

                function apiUrl(path) {
                    return ApiClient.getUrl('MovieNight/api/' + path);
                }

                function renderStatus(status) {
                    document.querySelector('#MovieNightStatus').textContent = JSON.stringify(status, null, 2);
                }

                function poll() {
                    ApiClient.getJSON(apiUrl('status')).then(renderStatus).catch(function (err) {
                        document.querySelector('#MovieNightStatus').textContent = 'status request failed: ' + err;
                    });
                }

                document.querySelector('#MovieNightConfigPage').addEventListener('pageshow', function () {
                    poll();
                    pollTimer = setInterval(poll, 3000);
                });

                document.querySelector('#MovieNightConfigPage').addEventListener('pagehide', function () {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                });

                document.querySelector('#MovieNightGoLive').addEventListener('click', function () {
                    var itemId = document.querySelector('#MovieNightItemId').value.trim();
                    var channelName = document.querySelector('#MovieNightChannelName').value.trim() || 'Movie Night';
                    if (!itemId) {
                        Dashboard.alert('Enter an item ID first.');
                        return;
                    }

                    ApiClient.ajax({
                        type: 'POST',
                        url: apiUrl('golive'),
                        data: JSON.stringify({ ItemId: itemId, ChannelName: channelName }),
                        contentType: 'application/json',
                    }).then(poll).catch(function () {
                        Dashboard.alert('Go Live failed - check status below and server logs.');
                        poll();
                    });
                });

                document.querySelector('#MovieNightStop').addEventListener('click', function () {
                    ApiClient.ajax({
                        type: 'POST',
                        url: apiUrl('stop'),
                    }).then(poll).catch(function () {
                        poll();
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
